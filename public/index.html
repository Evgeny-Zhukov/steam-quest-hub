<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Quest HUB | Игровой баланс и Своевременные Квесты</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        steam: {
                            dark: '#1b2838',
                            card: '#171a21',
                            accent: '#66c0f4',
                            btn: '#2a475e',
                            green: '#5c7e10',
                            brightGreen: '#a4d007',
                            rust: '#cd412b',
                            gold: '#f39c12'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body {
            background-color: #0d121a;
            color: #c6d4df;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: radial-gradient(circle at 50% 0%, #1b2838 0%, #0d121a 75%);
            min-height: 100vh;
        }
        .hud-border {
            border: 1px solid rgba(102, 192, 244, 0.2);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(102, 192, 244, 0.05);
        }
        .rust-card {
            border-left: 4px solid #cd412b;
        }
        .cs2-card {
            border-left: 4px solid #66c0f4;
        }
        .glow-accent {
            box-shadow: 0 0 12px rgba(102, 192, 244, 0.4);
        }
        .glow-gold {
            box-shadow: 0 0 12px rgba(243, 156, 18, 0.4);
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #171a21;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a475e;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #66c0f4;
        }
    </style>
</head>
<body class="selection:bg-steam-accent selection:text-black antialiased">
    <div id="root"></div>

    <!-- Firebase SDK (v10 Modular) & React App -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { 
        getFirestore, collection, addDoc, updateDoc, doc, setDoc, onSnapshot 
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDFA2PLwpHqgX9GwHCbK8c-7tymJGygf_c",
        authDomain: "steam-quest-hub.firebaseapp.com",
        projectId: "steam-quest-hub",
        storageBucket: "steam-quest-hub.firebasestorage.app",
        messagingSenderId: "357931401290",
        appId: "1:357931401290:web:d2647c315ef4d5c0c4e6b3",
        measurementId: "G-VYREXGW863"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      window.db = db;
      window.fs = { collection, addDoc, updateDoc, doc, setDoc, onSnapshot };
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const DEFAULT_DATA = {
            baseHours: 2,
            bonusBank: 0,
            usedToday: 0,
            xp: 0,
            level: 1,
            pin: "1234",
            version: "v2.0",
            streak: 0,
            lastResetDate: new Date().toISOString().split('T')[0],
            lastWeeklyResetWeek: getWeekNumber(new Date()),
            unlockedAchievements: [],
            quests: [
                { id: "1", title: "Уроки сданы до 18:00", bonus: 1, type: "daily", category: "school", desc: "Все сделано, портфель собран" },
                { id: "2", title: "Исправить тройку/двойку", bonus: 1, type: "quest", category: "school", desc: "Получить 4 или 5 по предмету, где завал" },
                { id: "3", title: "Идеальная неделя", bonus: 2, type: "weekly", category: "discipline", desc: "Неделя без двоек и заметок" },
                { id: "4", title: "Технический осмотр скутера", bonus: 1, type: "quest", category: "scooter", desc: "Помощь по дому / гаражу или чистка экипа" }
            ],
            requests: [],
            shopItems: [
                { id: "101", title: "+1 час в Steam", cost: 1, icon: "fa-gamepad" },
                { id: "102", title: "Сдвиг комендантского часа на 1ч", cost: 2, icon: "fa-motorcycle" },
                { id: "103", title: "Бюджет на вкусняшку/расходник", cost: 3, icon: "fa-gas-pump" },
                { id: "104", title: "Защитный 'Щит' (списать 1 плохую оценку)", cost: 4, icon: "fa-shield-halved" }
            ],
            history: [
                { id: 1001, text: "Система активирована v2.0 (Автосброс, Ачивки, Серии!)", date: new Date().toLocaleDateString('ru-RU') }
            ]
        };

        const ACHIEVEMENTS_LIST = [
            { id: "first_quest", title: "Первая кровь", desc: "Выполнить и подтвердить 1-й квест", icon: "fa-bolt", color: "text-amber-400" },
            { id: "streak_3", title: "Ударный ритм", desc: "Удерживать серию в 3 дня подряд", icon: "fa-fire", color: "text-red-500" },
            { id: "xp_500", title: "Опытный Геймер", desc: "Набрать 500 XP за квесты", icon: "fa-star", color: "text-steam-accent" },
            { id: "lvl_3", title: "Взрослый Лрафт", desc: "Достигнуть 3-го уровня профиля", icon: "fa-trophy", color: "text-yellow-400" },
            { id: "first_buy", title: "Транзакция", desc: "Купить первую привилегию в Магазине", icon: "fa-cart-shopping", color: "text-emerald-400" }
        ];

        const LEVEL_REWARDS = {
            1: "Стандартный доступ к Steam и скутеру",
            2: "Бонус: +50 XP за каждый последующий квест",
            3: "Разблокирован купон на сдвиг комендантского часа",
            5: "Эксклюзивный девайс для ПК от старшего"
        };

        function getWeekNumber(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
            var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
        }

        function App() {
            const [mode, setMode] = useState("child");
            const [data, setData] = useState(DEFAULT_DATA);
            const [isLoaded, setIsLoaded] = useState(false);

            const [pinInput, setPinInput] = useState("");
            const [showPinModal, setShowPinModal] = useState(false);
            const [showHostingGuide, setShowHostingGuide] = useState(false);
            const [showNewQuestModal, setShowNewQuestModal] = useState(false);
            const [showPenalizeModal, setShowPenalizeModal] = useState(false);
            const [showShopModal, setShowShopModal] = useState(false);
            const [editingShopItem, setEditingShopItem] = useState(null);
            const [notification, setNotification] = useState(null);

            const [newQuestTitle, setNewQuestTitle] = useState("");
            const [newQuestBonus, setNewQuestBonus] = useState(1);
            const [newQuestCategory, setNewQuestCategory] = useState("school");
            const [penalizeReason, setPenalizeReason] = useState("");
            const [penalizeHours, setPenalizeHours] = useState(1);

            const [shopTitle, setShopTitle] = useState("");
            const [shopCost, setShopCost] = useState(1);
            const [shopIcon, setShopIcon] = useState("fa-gamepad");

            // Инициализация и слушатели Cloud Firestore
            useEffect(() => {
                const checkFirebase = setInterval(() => {
                    if (window.db && window.fs) {
                        clearInterval(checkFirebase);
                        const { doc, onSnapshot, setDoc, collection } = window.fs;
                        const db = window.db;

                        onSnapshot(doc(db, "system_state", "main"), (docSnap) => {
                            if (docSnap.exists()) {
                                const cloudData = docSnap.data();
                                // Проверка и Автоматический сброс по дате
                                processAutoReset(cloudData);
                            } else {
                                setDoc(doc(db, "system_state", "main"), DEFAULT_DATA);
                            }
                            setIsLoaded(true);
                        });

                        onSnapshot(collection(db, "quests"), (snapshot) => {
                            if (!snapshot.empty) {
                                const cloudQuests = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                                setData(prev => ({ ...prev, quests: cloudQuests }));
                            }
                        });

                        onSnapshot(collection(db, "requests"), (snapshot) => {
                            const cloudRequests = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                            setData(prev => ({ ...prev, requests: cloudRequests }));
                        });

                        onSnapshot(collection(db, "shop_items"), (snapshot) => {
                            if (!snapshot.empty) {
                                const cloudShop = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                                setData(prev => ({ ...prev, shopItems: cloudShop }));
                            }
                        });
                    }
                }, 200);

                return () => clearInterval(checkFirebase);
            }, []);

            // Автоматический сброс Дня и Недели по дате
            const processAutoReset = (cloudData) => {
                const todayStr = new Date().toISOString().split('T')[0];
                const currentWeek = getWeekNumber(new Date());

                let updatedFields = { ...cloudData };
                let needCloudSave = false;

                // 1. Ежедневный сброс в полночь
                if (cloudData.lastResetDate !== todayStr) {
                    updatedFields.usedToday = 0;
                    updatedFields.lastResetDate = todayStr;
                    
                    // Если за вчера играл нормально и закрыл день — увеличиваем Streak
                    updatedFields.streak = (cloudData.streak || 0) + 1;
                    updatedFields.history = [{
                        id: Date.now(),
                        text: `🔄 Новый день! Таймер сброшен. Серия дней: ${updatedFields.streak} 🔥`,
                        date: new Date().toLocaleDateString('ru-RU')
                    }, ...(cloudData.history || [])];
                    
                    needCloudSave = true;
                }

                // 2. Еженедельный сброс в понедельник
                if (cloudData.lastWeeklyResetWeek !== currentWeek) {
                    updatedFields.bonusBank = 0; // Сгорание неиспользованного бонуса
                    updatedFields.lastWeeklyResetWeek = currentWeek;
                    updatedFields.history = [{
                        id: Date.now(),
                        text: "🧹 Начало новой недели! Неиспользованный банк бонусов обнулен.",
                        date: new Date().toLocaleDateString('ru-RU')
                    }, ...(updatedFields.history || [])];

                    needCloudSave = true;
                }

                if (needCloudSave) {
                    saveSystemStateToCloud(updatedFields);
                } else {
                    setData(prev => ({ ...prev, ...cloudData }));
                }
            };

            const saveSystemStateToCloud = async (updatedFields) => {
                if (window.db && window.fs) {
                    try {
                        await window.fs.updateDoc(window.fs.doc(window.db, "system_state", "main"), updatedFields);
                    } catch (e) {
                        console.error("Ошибка сохранения в Cloud:", e);
                    }
                }
            };

            const checkAchievements = (currentData, newXp, newLevel, newBank) => {
                let unlocked = [...(currentData.unlockedAchievements || [])];
                let hasNew = false;

                const grant = (achId) => {
                    if (!unlocked.includes(achId)) {
                        unlocked.push(achId);
                        hasNew = true;
                        const ach = ACHIEVEMENTS_LIST.find(a => a.id === achId);
                        showToast(`🏆 Достижение получено: ${ach.title}!`, "success");
                    }
                };

                if (newXp > 0) grant("first_quest");
                if (newXp >= 500) grant("xp_500");
                if (newLevel >= 3) grant("lvl_3");
                if (currentData.streak >= 3) grant("streak_3");

                if (hasNew) {
                    saveSystemStateToCloud({ unlockedAchievements: unlocked });
                }
            };

            const triggerConfetti = () => {
                try {
                    confetti({ particleCount: 70, spread: 60, origin: { y: 0.7 } });
                } catch (e) {}
            };

            const showToast = (msg, type = "info") => {
                setNotification({ msg, type });
                setTimeout(() => setNotification(null), 3500);
            };

            const handleSwitchMode = (targetMode) => {
                if (targetMode === "adult" && mode !== "adult") {
                    setShowPinModal(true);
                } else {
                    setMode("child");
                    showToast("Переключено в Детский режим");
                }
            };

            const verifyPin = (e) => {
                e.preventDefault();
                if (pinInput === data.pin) {
                    setMode("adult");
                    setShowPinModal(false);
                    setPinInput("");
                    showToast("Доступ разрешен. Взрослый режим активирован", "success");
                } else {
                    showToast("Неверный PIN-код!", "error");
                    setPinInput("");
                }
            };

            const requestQuestCompletion = async (quest) => {
                if (data.requests.some(r => r.questId === quest.id && r.status === "pending")) {
                    showToast("Запрос по этому квесту уже отправлен и ждет подтверждения!", "warning");
                    return;
                }

                const newRequest = {
                    questId: quest.id,
                    questTitle: quest.title,
                    bonus: quest.bonus,
                    timestamp: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }),
                    status: "pending"
                };

                if (window.db && window.fs) {
                    await window.fs.addDoc(window.fs.collection(window.db, "requests"), newRequest);
                }

                showToast(`Запрос на "${quest.title}" (+${quest.bonus}ч) отправлен старшему!`, "success");
            };

            const logUsedTime = (hours) => {
                const totalAvail = data.baseHours + data.bonusBank;
                if (data.usedToday + hours > totalAvail) {
                    showToast("Недостаточно доступных часов! Выполняй квесты.", "error");
                    return;
                }

                let newBonusBank = data.bonusBank;
                const remainingBase = Math.max(0, data.baseHours - data.usedToday);
                if (hours > remainingBase) {
                    const extra = hours - remainingBase;
                    newBonusBank = Math.max(0, newBonusBank - extra);
                }

                const newUsed = data.usedToday + hours;
                const newHistory = [{
                    id: Date.now(),
                    text: `Списано ${hours}ч. Сыграно сегодня: ${newUsed}ч`,
                    date: new Date().toLocaleDateString('ru-RU')
                }, ...data.history];

                saveSystemStateToCloud({
                    usedToday: newUsed,
                    bonusBank: newBonusBank,
                    history: newHistory
                });

                showToast(`Зафиксировано ${hours}ч. Приятного отдыха!`, "info");
            };

            const handleApproveRequest = async (req) => {
                const newBank = data.bonusBank + req.bonus;
                const addedXp = req.bonus * 50; // 50 XP за 1 бонусный час
                let newXp = data.xp + addedXp;
                let newLevel = data.level;
                if (newXp >= newLevel * 300) {
                    newLevel += 1;
                    showToast(`🎉 УРОВЕНЬ ПОВЫШЕН! Теперь Level ${newLevel}!`, "success");
                }

                const newHistory = [{
                    id: Date.now(),
                    text: `Подтвержден квест "${req.questTitle}". Начислено +${req.bonus}ч и +${addedXp} XP!`,
                    date: new Date().toLocaleDateString('ru-RU')
                }, ...data.history];

                if (window.db && window.fs) {
                    await window.fs.updateDoc(window.fs.doc(window.db, "requests", req.id), { status: "approved" });
                }

                saveSystemStateToCloud({
                    bonusBank: newBank,
                    xp: newXp,
                    level: newLevel,
                    history: newHistory
                });

                checkAchievements(data, newXp, newLevel, newBank);
                triggerConfetti();
            };

            const handleRejectRequest = async (req) => {
                if (window.db && window.fs) {
                    await window.fs.updateDoc(window.fs.doc(window.db, "requests", req.id), { status: "rejected" });
                }

                const newHistory = [{
                    id: Date.now(),
                    text: `Отклонен запрос на квест "${req.questTitle}".`,
                    date: new Date().toLocaleDateString('ru-RU')
                }, ...data.history];

                saveSystemStateToCloud({ history: newHistory });
                showToast(`Запрос отклонен`, "info");
            };

            const handleAddQuest = async (e) => {
                e.preventDefault();
                if (!newQuestTitle) return;

                const newQuest = {
                    title: newQuestTitle,
                    bonus: parseInt(newQuestBonus),
                    type: "quest",
                    category: newQuestCategory,
                    desc: "Пользовательский квест от старшего"
                };

                if (window.db && window.fs) {
                    await window.fs.addDoc(window.fs.collection(window.db, "quests"), newQuest);
                }

                setNewQuestTitle("");
                setShowNewQuestModal(false);
                showToast("Новый квест успешно добавлен в облако!", "success");
            };

            const handleSaveShopItem = async (e) => {
                e.preventDefault();
                if (!shopTitle) return;

                const itemData = {
                    title: shopTitle,
                    cost: parseInt(shopCost),
                    icon: shopIcon
                };

                if (window.db && window.fs) {
                    if (editingShopItem) {
                        await window.fs.updateDoc(window.fs.doc(window.db, "shop_items", editingShopItem.id), itemData);
                        showToast("Товар успешно обновлен!", "success");
                    } else {
                        await window.fs.addDoc(window.fs.collection(window.db, "shop_items"), itemData);
                        showToast("Новый товар добавлен в Магазин!", "success");
                    }
                }

                setShowShopModal(false);
                setEditingShopItem(null);
                setShopTitle("");
                setShopCost(1);
            };

            const openEditShopModal = (item = null) => {
                if (item) {
                    setEditingShopItem(item);
                    setShopTitle(item.title);
                    setShopCost(item.cost);
                    setShopIcon(item.icon || "fa-gamepad");
                } else {
                    setEditingShopItem(null);
                    setShopTitle("");
                    setShopCost(1);
                    setShopIcon("fa-gamepad");
                }
                setShowShopModal(true);
            };

            const handleBuyShopItem = (item) => {
                if (data.bonusBank < item.cost) {
                    showToast("Недостаточно бонусных часов в Банке!", "error");
                    return;
                }

                const newBank = data.bonusBank - item.cost;
                const newHistory = [{
                    id: Date.now(),
                    text: `Приобретена привилегия: "${item.title}" за ${item.cost} бонус-часа!`,
                    date: new Date().toLocaleDateString('ru-RU')
                }, ...data.history];

                let unlocked = [...(data.unlockedAchievements || [])];
                if (!unlocked.includes("first_buy")) {
                    unlocked.push("first_buy");
                    showToast("🏆 Ачивка: Транзакция!", "success");
                }

                saveSystemStateToCloud({
                    bonusBank: newBank,
                    unlockedAchievements: unlocked,
                    history: newHistory
                });

                triggerConfetti();
                showToast(`Успешно куплено: ${item.title}!`, "success");
            };

            const handlePenalize = (e) => {
                e.preventDefault();
                const penalty = parseInt(penalizeHours);
                const newBank = Math.max(0, data.bonusBank - penalty);

                const newHistory = [{
                    id: Date.now(),
                    text: `Штраф/Списание: -${penalty}ч. Причина: ${penalizeReason || "Нарушение дисциплины"}`,
                    date: new Date().toLocaleDateString('ru-RU')
                }, ...data.history];

                saveSystemStateToCloud({
                    bonusBank: newBank,
                    streak: 0, // Сброс серии при штрафе
                    history: newHistory
                });

                setPenalizeReason("");
                setShowPenalizeModal(false);
                showToast(`Применен дебафф -${penalty}ч. Серия сброшена.`, "warning");
            };

            const totalAvailableToday = Math.max(0, (data.baseHours + data.bonusBank) - data.usedToday);

            return (
                <div className="max-w-6xl mx-auto p-3 sm:p-6 min-h-screen flex flex-col justify-between">
                    
                    {/* Header HUD Navigation */}
                    <header className="bg-steam-card p-4 rounded-xl hud-border mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div className="flex items-center gap-3">
                            <div className="w-12 h-12 rounded-lg bg-gradient-to-br from-steam-accent to-blue-700 flex items-center justify-center text-white text-2xl font-bold glow-accent">
                                <i className="fa-brands fa-steam"></i>
                            </div>
                            <div>
                                <h1 className="text-xl font-black text-white tracking-wider uppercase flex items-center gap-2">
                                    HUB БРАТА <span className="text-xs px-2 py-0.5 rounded bg-steam-btn text-steam-accent border border-steam-accent/30">{data.version}</span>
                                </h1>
                                <p className="text-xs text-gray-400">Система контроля времени & Игровые Ачивки</p>
                            </div>
                        </div>

                        {/* Mode Indicator & Switcher */}
                        <div className="flex items-center gap-3 bg-slate-900/80 p-1.5 rounded-lg border border-slate-700">
                            <button 
                                onClick={() => handleSwitchMode("child")}
                                className={`px-4 py-2 rounded-md font-semibold text-xs transition-all duration-200 flex items-center gap-2 ${mode === 'child' ? 'bg-steam-accent text-slate-950 font-bold glow-accent' : 'text-gray-400 hover:text-white'}`}
                            >
                                <i className="fa-solid fa-child"></i> Детский Режим
                            </button>
                            <button 
                                onClick={() => handleSwitchMode("adult")}
                                className={`px-4 py-2 rounded-md font-semibold text-xs transition-all duration-200 flex items-center gap-2 ${mode === 'adult' ? 'bg-amber-500 text-slate-950 font-bold glow-gold' : 'text-gray-400 hover:text-white'}`}
                            >
                                <i className="fa-solid fa-user-shield"></i> Взрослый Режим
                            </button>
                        </div>
                    </header>

                    {/* Toast Notification */}
                    {notification && (
                        <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-lg shadow-xl text-sm font-semibold flex items-center gap-3 border ${
                            notification.type === 'success' ? 'bg-emerald-900/90 border-emerald-500 text-emerald-200' :
                            notification.type === 'error' ? 'bg-red-900/90 border-red-500 text-red-200' :
                            notification.type === 'warning' ? 'bg-amber-900/90 border-amber-500 text-amber-200' :
                            'bg-steam-btn border-steam-accent text-steam-accent'
                        }`}>
                            <i className="fa-solid fa-circle-info"></i>
                            {notification.msg}
                        </div>
                    )}

                    {/* MAIN HUD CONTENT */}
                    <main className="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-auto">

                        </div>
                    )}

                    {showPenalizeModal && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-steam-card p-6 rounded-xl hud-border max-w-md w-full space-y-4 border border-red-500/40">
                                <div className="flex items-center justify-between">
                                    <h3 className="text-sm font-bold text-red-400 uppercase flex items-center gap-2">
                                        <i className="fa-solid fa-triangle-exclamation"></i> Применить Дебафф / Штраф
                                    </h3>
                                    <button onClick={() => setShowPenalizeModal(false)} className="text-gray-400 hover:text-white">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                                <form onSubmit={handlePenalize} className="space-y-3">
                                    <div>
                                        <label className="text-xs text-gray-400 block mb-1">Причина штрафа</label>
                                        <input 
                                            type="text" 
                                            placeholder="Скрытие оценки / обман / нарушение безопасности" 
                                            value={penalizeReason}
                                            onChange={(e) => setPenalizeReason(e.target.value)}
                                            className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs text-white focus:outline-none focus:border-red-500"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-xs text-gray-400 block mb-1">Количество списываемых часов</label>
                                        <select 
                                            value={penalizeHours} 
                                            onChange={(e) => setPenalizeHours(e.target.value)}
                                            className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs text-white"
                                        >
                                            <option value="1">-1 час</option>
                                            <option value="2">-2 часа</option>
                                        </select>
                                    </div>
                                    <button type="submit" className="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-2.5 rounded text-xs uppercase tracking-wider transition mt-2">
                                        Подтвердить списание
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    <footer className="mt-8 text-center text-xs text-gray-600 border-t border-slate-900 pt-4">
                        Steam Quest HUB v2.0 • Система баланса времени, учебы и скутера • Разработано для брата
                    </footer>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
