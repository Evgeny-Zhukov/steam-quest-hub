<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Play HUB | Семейный баланс игрового времени</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        game: {
                            dark: '#121824',
                            card: '#1a2232',
                            accent: '#4f46e5',
                            lightAccent: '#6366f1',
                            btn: '#28334e',
                            green: '#10b981',
                            brightGreen: '#34d399',
                            rust: '#f43f5e',
                            gold: '#fbbf24'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body {
            background-color: #0b0f17;
            color: #c6d4df;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: radial-gradient(circle at 50% 0%, #1a2232 0%, #0b0f17 75%);
            min-height: 100vh;
        }
        .hud-border {
            border: 1px solid rgba(99, 102, 241, 0.2);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(99, 102, 241, 0.05);
        }
        .rust-card { border-left: 4px solid #f43f5e; }
        .game-card { border-left: 4px solid #6366f1; }
        .glow-accent { box-shadow: 0 0 12px rgba(99, 102, 241, 0.4); }
        .glow-gold { box-shadow: 0 0 12px rgba(251, 191, 36, 0.4); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a2232; }
        ::-webkit-scrollbar-thumb { background: #28334e; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6366f1; }
    </style>
</head>
<body class="selection:bg-game-lightAccent selection:text-white antialiased">
    <div id="root"></div>

    <!-- Firebase SDK (v10 Modular) -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { 
        getAuth, sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink, signOut, onAuthStateChanged 
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import { 
        getFirestore, collection, addDoc, updateDoc, doc, setDoc, onSnapshot, getDoc 
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDFA2PLwpHqgX9GwHCbK8c-7tymJGygf_c",
        authDomain: "steam-quest-hub.firebaseapp.com",
        projectId: "steam-quest-hub",
        storageBucket: "steam-quest-hub.firebasestorage.app",
        messagingSenderId: "357931401290",
        appId: "1:357931401290:web:d2647c315ef4d5c0c4e6b3",
        measurementId: "G-VYREXGW863"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      window.db = db;
      window.auth = auth;
      window.authSDK = { sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink, signOut, onAuthStateChanged };
      window.fs = { collection, addDoc, updateDoc, doc, setDoc, onSnapshot, getDoc };
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const DEFAULT_FAMILY_DATA = {
            baseHours: 2,
            bonusBank: 0,
            usedToday: 0,
            xp: 0,
            level: 1,
            streak: 0,
            lastResetDate: new Date().toISOString().split('T')[0],
            unlockedAchievements: [],
            version: "v3.1 Clean"
        };

        const ACHIEVEMENTS_LIST = [
            { id: "first_quest", title: "Первая победа", desc: "Выполнить 1 квест", icon: "fa-bolt", color: "text-amber-400" },
            { id: "streak_3", title: "Ударный ритм", desc: "Серия в 3 дня подряд", icon: "fa-fire", color: "text-rose-500" },
            { id: "xp_500", title: "Опытный Игрок", desc: "Набрать 500 XP", icon: "fa-star", color: "text-indigo-400" },
            { id: "lvl_3", title: "Мастер Квестов", desc: "Достигнуть 3-го уровня", icon: "fa-trophy", color: "text-yellow-400" }
        ];

        function App() {
            const [user, setUser] = useState(null);
            const [userProfile, setUserProfile] = useState(null);
            const [familyData, setFamilyData] = useState(DEFAULT_FAMILY_DATA);
            const [quests, setQuests] = useState([]);
            const [requests, setRequests] = useState([]);
            const [shopItems, setShopItems] = useState([]);
            const [history, setHistory] = useState([]);

            // UI states
            const [emailInput, setEmailInput] = useState("");
            const [familyCodeInput, setFamilyCodeInput] = useState("");
            const [roleInput, setRoleInput] = useState("adult");
            const [acceptedTerms, setAcceptedTerms] = useState(false);
            const [emailSent, setEmailSent] = useState(false);
            const [showLegalModal, setShowLegalModal] = useState(false);
            const [legalTab, setLegalTab] = useState("privacy");
            const [notification, setNotification] = useState(null);

            useEffect(() => {
                const checkAuth = setInterval(() => {
                    if (window.auth && window.authSDK && window.db) {
                        clearInterval(checkAuth);
                        const { onAuthStateChanged, isSignInWithEmailLink, signInWithEmailLink } = window.authSDK;

                        if (isSignInWithEmailLink(window.auth, window.location.href)) {
                            let email = window.localStorage.getItem('emailForSignIn');
                            if (!email) {
                                email = window.prompt('Подтвердите ваш Email для входа:');
                            }
                            if (email) {
                                signInWithEmailLink(window.auth, email, window.location.href)
                                    .then(() => {
                                        window.localStorage.removeItem('emailForSignIn');
                                        showToast("Успешный вход в аккаунт!", "success");
                                    })
                                    .catch(err => showToast("Ошибка входа: " + err.message, "error"));
                            }
                        }

                        onAuthStateChanged(window.auth, async (currentUser) => {
                            setUser(currentUser);
                            if (currentUser) {
                                const userDocRef = window.fs.doc(window.db, "users", currentUser.uid);
                                const userSnap = await window.fs.getDoc(userDocRef);
                                if (userSnap.exists()) {
                                    const profile = userSnap.data();
                                    setUserProfile(profile);
                                    subscribeToFamily(profile.familyId);
                                }
                            } else {
                                setUserProfile(null);
                            }
                        });
                    }
                }, 200);

                return () => clearInterval(checkAuth);
            }, []);

            const subscribeToFamily = (familyId) => {
                const { doc, collection, onSnapshot } = window.fs;
                const db = window.db;

                onSnapshot(doc(db, "families", familyId), (docSnap) => {
                    if (docSnap.exists()) setFamilyData(docSnap.data());
                });

                onSnapshot(collection(db, "families", familyId, "quests"), (snapshot) => {
                    setQuests(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                });

                onSnapshot(collection(db, "families", familyId, "requests"), (snapshot) => {
                    setRequests(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                });

                onSnapshot(collection(db, "families", familyId, "shop_items"), (snapshot) => {
                    setShopItems(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                });

                onSnapshot(collection(db, "families", familyId, "history"), (snapshot) => {
                    setHistory(snapshot.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => b.id - a.id));
                });
            };

            const handleSendAuthLink = async (e) => {
                e.preventDefault();
                if (!acceptedTerms) {
                    showToast("Необходимо принять Условия использования и Политику!", "warning");
                    return;
                }

                const actionCodeSettings = {
                    url: window.location.href,
                    handleCodeInApp: true,
                };

                try {
                    await window.authSDK.sendSignInLinkToEmail(window.auth, emailInput, actionCodeSettings);
                    window.localStorage.setItem('emailForSignIn', emailInput);
                    setEmailSent(true);
                    showToast("Ссылка для входа отправлена на вашу почту!", "success");
                } catch (err) {
                    showToast("Ошибка отправки: " + err.message, "error");
                }
            };

            const handleCompleteProfile = async (role, familyCode) => {
                if (!user) return;
                const { doc, setDoc } = window.fs;
                const db = window.db;

                let finalFamilyId = familyCode ? familyCode.toUpperCase() : "HUB-" + Math.floor(100000 + Math.random() * 900000);

                const profileData = {
                    email: user.email,
                    role: role,
                    familyId: finalFamilyId,
                    createdAt: new Date().toISOString()
                };

                await setDoc(doc(db, "users", user.uid), profileData);

                if (role === "adult") {
                    await setDoc(doc(db, "families", finalFamilyId), DEFAULT_FAMILY_DATA);
                }

                setUserProfile(profileData);
                subscribeToFamily(finalFamilyId);
                showToast(`Профиль создан! Код вашей семьи: ${finalFamilyId}`, "success");
            };

            const handleSignOut = () => {
                window.authSDK.signOut(window.auth);
                setUser(null);
                setUserProfile(null);
            };

            const showToast = (msg, type = "info") => {
                setNotification({ msg, type });
                setTimeout(() => setNotification(null), 3500);
            };

            if (!user || !userProfile) {
                return (
                    <div className="max-w-md mx-auto p-4 min-h-screen flex flex-col justify-center">
                        <div className="bg-game-card p-6 rounded-xl hud-border space-y-6">
                            <div className="text-center space-y-2">
                                <div className="w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-700 mx-auto flex items-center justify-center text-3xl font-bold text-white glow-accent">
                                    <i className="fa-solid fa-gamepad"></i>
                                </div>
                                <h1 className="text-2xl font-black text-white uppercase tracking-wider">Quest Play HUB</h1>
                                <p className="text-xs text-gray-400">Семейный баланс игрового времени и квестов</p>
                            </div>

                            {user && !userProfile ? (
                                <div className="space-y-4">
                                    <h3 className="text-sm font-bold text-amber-400">Настройка семейной комнаты</h3>
                                    <div>
                                        <label className="text-xs text-gray-400 block mb-1">Ваша роль</label>
                                        <select 
                                            value={roleInput} 
                                            onChange={(e) => setRoleInput(e.target.value)}
                                            className="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-xs text-white"
                                        >
                                            <option value="adult">Родитель / Организатор</option>
                                            <option value="child">Ребенок / Участник</option>
                                        </select>
                                    </div>
                                    {roleInput === "child" && (
                                        <div>
                                            <label className="text-xs text-gray-400 block mb-1">Код Семейной Комнаты</label>
                                            <input 
                                                type="text" 
                                                placeholder="Например: HUB-892102" 
                                                value={familyCodeInput}
                                                onChange={(e) => setFamilyCodeInput(e.target.value)}
                                                className="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-xs text-white uppercase font-mono"
                                            />
                                        </div>
                                    )}
                                    <button 
                                        onClick={() => handleCompleteProfile(roleInput, familyCodeInput)}
                                        className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded text-xs uppercase tracking-wider transition"
                                    >
                                        Войти в Семейный HUB
                                    </button>
                                </div>
                            ) : emailSent ? (
                                <div className="bg-slate-900 p-4 rounded-lg border border-indigo-500/40 text-center space-y-2">
                                    <i className="fa-solid fa-envelope-circle-check text-3xl text-indigo-400 mb-1"></i>
                                    <h3 className="text-sm font-bold text-white">Проверьте вашу почту!</h3>
                                    <p className="text-xs text-gray-400">Ссылка для входа отправлена на <strong className="text-white">{emailInput}</strong>.</p>
                                </div>
                            ) : (
                                <form onSubmit={handleSendAuthLink} className="space-y-4">
                                    <div>
                                        <label className="text-xs text-gray-400 block mb-1">Ваш Email</label>
                                        <input 
                                            type="email" 
                                            required
                                            placeholder="name@example.com" 
                                            value={emailInput}
                                            onChange={(e) => setEmailInput(e.target.value)}
                                            className="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-xs text-white focus:border-indigo-500 outline-none"
                                        />
                                    </div>

                                    <div className="flex items-start gap-2 pt-1">
                                        <input 
                                            type="checkbox" 
                                            id="terms"
                                            checked={acceptedTerms}
                                            onChange={(e) => setAcceptedTerms(e.target.checked)}
                                            className="mt-0.5 rounded border-slate-700 bg-slate-900 text-indigo-500 focus:ring-0"
                                        />
                                        <label htmlFor="terms" className="text-[11px] text-gray-400 leading-tight">
                                            Я согласен с <button type="button" onClick={() => { setLegalTab("terms"); setShowLegalModal(true); }} className="text-indigo-400 underline">Условиями использования</button> и <button type="button" onClick={() => { setLegalTab("privacy"); setShowLegalModal(true); }} className="text-indigo-400 underline">Политикой конфиденциальности</button>.
                                        </label>
                                    </div>

                                    <button 
                                        type="submit" 
                                        className="w-full bg-game-btn hover:bg-indigo-600 text-white font-bold py-3 rounded text-xs uppercase tracking-wider transition border border-indigo-500/40 flex items-center justify-center gap-2"
                                    >
                                        Получить ссылку для входа <i className="fa-solid fa-arrow-right"></i>
                                    </button>
                                </form>
                            )}

                            <div className="border-t border-slate-800 pt-4 text-center">
                                <button 
                                    onClick={() => setShowLegalModal(true)}
                                    className="text-[11px] text-gray-500 hover:text-gray-400 transition"
                                >
                                    Правовая информация и конфиденциальность
                                </button>
                            </div>
                        </div>

                        {/* LEGAL MODAL */}
                        {showLegalModal && (
                            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                                <div className="bg-game-card p-6 rounded-xl hud-border max-w-2xl w-full space-y-4 max-h-[80vh] overflow-y-auto text-xs text-gray-300">
                                    <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                                        <div className="flex items-center gap-4">
                                            <button 
                                                onClick={() => setLegalTab("privacy")} 
                                                className={`font-bold uppercase ${legalTab === 'privacy' ? 'text-indigo-400 border-b-2 border-indigo-400' : 'text-gray-500'}`}
                                            >
                                                Политика конфиденциальности
                                            </button>
                                            <button 
                                                onClick={() => setLegalTab("terms")} 
                                                className={`font-bold uppercase ${legalTab === 'terms' ? 'text-indigo-400 border-b-2 border-indigo-400' : 'text-gray-500'}`}
                                            >
                                                Условия использования
                                            </button>
                                        </div>
                                        <button onClick={() => setShowLegalModal(false)} className="text-gray-400 hover:text-white">
                                            <i className="fa-solid fa-xmark"></i>
                                        </button>
                                    </div>

                                    {legalTab === "privacy" ? (
                                        <div className="space-y-3 leading-relaxed">
                                            <h4 className="font-bold text-white">1. Сбор данных</h4>
                                            <p>Собирается только Email для авторизации. Пароли не хранятся (беспарольный вход).</p>
                                            <h4 className="font-bold text-white">2. Использование данных</h4>
                                            <p>Данные используются только для функционирования сервиса и синхронизации внутри семьи.</p>
                                            <h4 className="font-bold text-white">3. Авторские права</h4>
                                            <p>Сервис не использует чужие товарные знаки и бренды. Все игровые термины носят общий характер.</p>
                                        </div>
                                    ) : (
                                        <div className="space-y-3 leading-relaxed">
                                            <h4 className="font-bold text-white">1. Правила сервиса</h4>
                                            <p>Quest Play HUB — независимый инструмент для внутрисемейного планирования времени.</p>
                                        </div>
                                    )}

                                    <button onClick={() => setShowLegalModal(false)} className="w-full bg-slate-800 text-white font-bold py-2 rounded">
                                        Закрыть
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            return (
                <div className="max-w-6xl mx-auto p-3 sm:p-6 min-h-screen flex flex-col justify-between">
                    <header className="bg-game-card p-4 rounded-xl hud-border mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-700 flex items-center justify-center text-white text-xl font-bold glow-accent">
                                <i className="fa-solid fa-gamepad"></i>
                            </div>
                            <div>
                                <h1 className="text-lg font-black text-white tracking-wider uppercase flex items-center gap-2">
                                    HUB СЕМЬИ: <span className="text-indigo-400">{userProfile.familyId}</span>
                                </h1>
                                <p className="text-[11px] text-gray-400">{userProfile.email} ({userProfile.role === 'adult' ? 'Родитель' : 'Участник'})</p>
                            </div>
                        </div>

                        <button 
                            onClick={handleSignOut}
                            className="bg-slate-800 hover:bg-slate-700 text-xs text-gray-300 px-3 py-2 rounded-lg font-bold border border-slate-700 transition flex items-center gap-2"
                        >
                            <i className="fa-solid fa-right-from-bracket"></i> Выйти
                        </button>
                    </header>

                    <main className="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-auto">
                        <div className="bg-game-card p-5 rounded-xl hud-border space-y-4">
                            <h3 className="text-sm font-bold text-white uppercase">Игровой Баланс Семьи</h3>
                            <div className="text-3xl font-black text-amber-400">+{familyData.bonusBank} бонус-часов</div>
                            <p className="text-xs text-gray-400">Код вашей семьи: <strong className="text-white font-mono">{userProfile.familyId}</strong></p>
                        </div>
                        <div className="lg:col-span-2 bg-game-card p-5 rounded-xl hud-border">
                            <h3 className="text-sm font-bold text-white uppercase mb-3">Семейные Квесты ({quests.length})</h3>
                            <p className="text-xs text-gray-400">Полностью защищенная юридически чистая комната.</p>
                        </div>
                    </main>

                    <footer className="mt-8 text-center text-xs text-gray-600 border-t border-slate-900 pt-4 flex justify-between items-center">
                        <span>Quest Play HUB v3.1</span>
                        <button onClick={() => setShowLegalModal(true)} className="hover:text-gray-400">Политика конфиденциальности</button>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
